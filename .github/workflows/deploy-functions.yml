name: Deploy Supabase (migrations + edge functions)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  # Applies migration files ADDED by this push to production, oldest first,
  # before any function deploys — so a function never ships ahead of the table
  # it needs. Founder decision 2026-10-06: the approval for a migration is the
  # merge of its PR (CLAUDE.md → PR Auto-Merge Policy: Claude asks before
  # merging any PR that adds a migration). Cloud Claude sessions can't answer
  # the Supabase connector's write confirmation, which is why this exists.
  #
  # Only files added in this push run; edited or older files never re-run.
  # A file whose version is already in supabase_migrations.schema_migrations
  # is skipped. Each file runs in one transaction together with its
  # schema_migrations row, through the Management API's query endpoint. A
  # failure stops the job, and the function deploy below doesn't run.
  migrate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply new migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          run_sql() {
            jq -n --arg q "$1" '{query: $q}' > /tmp/body.json
            curl -sS --fail-with-body -X POST "$api" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @/tmp/body.json
          }

          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against; nothing to apply."
            exit 0
          fi

          files=$(git diff --name-only --diff-filter=A "${BEFORE}" "${AFTER}" -- 'supabase/migrations/*.sql' | sort)
          if [ -z "$files" ]; then
            echo "No new migration files in this push."
            exit 0
          fi

          for f in $files; do
            base=$(basename "$f" .sql)
            version="${base%%_*}"
            name="${base#*_}"
            exists=$(run_sql "SELECT count(*) AS n FROM supabase_migrations.schema_migrations WHERE version = '${version}'" | jq -r '.[0].n')
            if [ "$exists" != "0" ]; then
              echo "skip ${f}: version ${version} already recorded"
              continue
            fi
            echo "apply ${f}"
            sql=$(printf 'BEGIN;\n%s\n;\nINSERT INTO supabase_migrations.schema_migrations (version, name) VALUES (%s, %s);\nCOMMIT;\n' \
              "$(cat "$f")" "'${version}'" "'${name}'")
            run_sql "$sql" > /dev/null
            echo "applied ${version} ${name}"
          done

  deploy:
    needs: migrate
    # Runs after a successful (or skipped, on manual dispatch) migrate job.
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploys every function in supabase/functions/ (the CLI skips _shared).
      # Each function's verify_jwt comes from supabase/config.toml, so this
      # never changes a function's auth mode. Previously this step listed 7 of
      # 14 functions by hand; the other 7 only reached production when someone
      # deployed them manually, and two never did.
      #
      # --prune deletes any deployed function that no longer has a folder here,
      # so retiring a function is: delete its folder, update the disclosures,
      # merge. Constitution Principle II: a feature is retired only once its
      # function is undeployed. --yes answers the CLI's delete confirmation.
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --prune --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
