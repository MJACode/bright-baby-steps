name: CI

# The quality gate from the constitution (.specify/memory/constitution.md):
# type-check, tests, and no new lint problems. `vite build` alone does not
# type-check, so a green build is not enough on its own.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint (no new problems above baseline)
        run: npm run lint:baseline
