name: Pre-launch setup

# Run once before launch to:
# 1. Configure custom SMTP so emails send from support@graceflare.com
# 2. Enable email confirmation
# 3. Apply the Grace Flare branded password-reset email template
# 4. Clear all test users and their data
#
# Required GitHub secrets:
#   SUPABASE_ACCESS_TOKEN  – personal access token from app.supabase.com/account/tokens
#   SUPABASE_PROJECT_REF   – project ref from Supabase → Project Settings → General
#   SMTP_HOST              – SMTP server hostname (e.g. smtp.resend.com)
#   SMTP_PORT              – SMTP port (e.g. 465)
#   SMTP_USER              – SMTP username (e.g. resend)
#   SMTP_PASS              – SMTP password / API key
#
# Recommended SMTP provider: Resend (resend.com)
#   1. Add and verify graceflare.com in Resend → Domains
#   2. Create an API key → use as SMTP_PASS, username is literally "resend"
#   3. Host: smtp.resend.com  Port: 465

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure auth — SMTP, branding, confirmations, reset email template
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          RECOVERY_TEMPLATE='<!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
          <body style="margin:0;padding:0;background-color:#fdfaf6;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;">
            <table width="100%" cellpadding="0" cellspacing="0" style="background:#fdfaf6;">
              <tr><td align="center" style="padding:40px 20px;">
                <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:100%;">
                  <tr>
                    <td style="background:#43b17e;padding:32px 40px;text-align:center;">
                      <p style="margin:0;font-size:32px;">🌱</p>
                      <h1 style="margin:8px 0 0;color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-.3px;">Grace Flare</h1>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:40px 40px 32px;">
                      <h2 style="margin:0 0 12px;color:#1a1a2e;font-size:20px;font-weight:700;">Reset your password</h2>
                      <p style="margin:0 0 24px;color:#555568;font-size:15px;line-height:1.6;">We received a request to reset the password on your Baby Steps account. Click the button below to choose a new one.</p>
                      <div style="text-align:center;margin:32px 0;">
                        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#43b17e;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:14px 32px;border-radius:8px;">Reset Password</a>
                      </div>
                      <p style="margin:0;color:#9999aa;font-size:13px;line-height:1.6;">This link expires in 1 hour. If you did not request a password reset, you can safely ignore this email — your password will not change.</p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:20px 40px 32px;border-top:1px solid #f0ede8;text-align:center;">
                      <p style="margin:0;color:#bbbbcc;font-size:12px;">© 2026 Grace Flare &nbsp;·&nbsp; <a href="{{ .SiteURL }}/privacy" style="color:#bbbbcc;text-decoration:underline;">Privacy Policy</a></p>
                    </td>
                  </tr>
                </table>
              </td></tr>
            </table>
          </body>
          </html>'

          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tmpl "$RECOVERY_TEMPLATE" \
              --arg host "$SMTP_HOST" \
              --arg port "$SMTP_PORT" \
              --arg user "$SMTP_USER" \
              --arg pass "$SMTP_PASS" \
              '{
                mailer_autoconfirm: false,
                smtp_sender_name: "Grace Flare",
                smtp_admin_email: "support@graceflare.com",
                smtp_host: $host,
                smtp_port: $port,
                smtp_user: $user,
                smtp_pass: $pass,
                mailer_templates_recovery_content: $tmpl
              }')")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Supabase auth config update failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Auth config updated — emails will send from support@graceflare.com."

      - name: Clear all test users and data
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SQL=$(cat supabase/migrations/20260417000001_clear_all_users.sql)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg sql "$SQL" '{query: $sql}')")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Data cleanup failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "All test data cleared."
