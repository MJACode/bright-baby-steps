workflows:
  ios-release:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      # References the App Store Connect integration named "GraceFlare"
      # configured in Codemagic → Teams → Integrations → App Store Connect.
      # Drives both ios_signing (cert / profile fetch) and the publishing
      # step's `auth: integration` (TestFlight upload).
      app_store_connect: GraceFlare

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      # NOTE: deliberately NO `ios_signing:` block here. That block triggers
      # Codemagic's automatic pre-build signing flow, which on first build for
      # a new Bundle ID fails with "No matching profiles found" and never runs
      # the "Set up code signing" script step (where --create lives). Manual
      # script-driven signing (below) bypasses the auto-flow entirely.
      groups:
        # Imports the "GraceFlare" environment-variable group from the
        # Codemagic UI (App → Environment variables → Group: GraceFlare).
        # Without this line, variables added to that group (notably
        # CERTIFICATE_PRIVATE_KEY) aren't exposed to the workflow's shell,
        # and `app-store-connect fetch-signing-files --certificate-key`
        # fails with `Environment variable "CERTIFICATE_PRIVATE_KEY" is
        # not defined`.
        - GraceFlare
      vars:
        BUNDLE_ID: com.graceflare.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # --- Codemagic UI → Environment variables (Secure unless noted) ---
        # VITE_APP_URL              https://graceflare.com  (Plain text)
        # CERTIFICATE_PRIVATE_KEY   RSA priv key Codemagic uses to encrypt
        #                           fetched signing certs. Generate with:
        #                             ssh-keygen -t rsa -b 2048 -m PEM \
        #                               -f codemagic_signing -q -N ""
        # --- Codemagic UI → Team integrations → App Store Connect ---
        # The Issuer ID + Key ID + .p8 file are configured there, not as
        # env vars. The `auth: integration` line under publishing
        # references that integration. Same key drives `ios_signing` above.
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build
        # VITE_APP_URL comes from Codemagic env vars once you have a domain.
        # Until then it falls back to window.location.origin = graceflare://localhost.

      - name: Add iOS platform
        script: |
          # Always start clean — ios/ is not committed to git
          rm -rf ios/
          npx cap add ios

      - name: Copy app icons into iOS project
        # The 1024 master + 15 pre-rendered iOS sizes + Contents.json live at
        # assets/ios/AppIcon.appiconset/. We blow away the default Capacitor
        # AppIcon.appiconset (which has a blank icon) and drop ours in. This
        # also catches stale files Capacitor's template might have shipped that
        # we don't want in the final binary.
        # Android assets live at assets/android/mipmap-*/ for when we add an
        # Android workflow — not wired up here yet.
        script: |
          DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$DEST"
          cp -R assets/ios/AppIcon.appiconset "$DEST"

      - name: Sync Capacitor + install CocoaPods
        # `cap sync ios` copies dist/ into the native project and is supposed
        # to run `pod install` as part of its update phase, but Capacitor 8
        # sometimes skips pod install (the sync step finishing in <1s on
        # build #6 was a tell that no pods were installed — `pod install` on
        # a fresh project normally takes 30+s). Without pod install, no
        # `ios/App/App.xcworkspace` is generated, and `xcode-project
        # build-ipa --workspace ios/App/App.xcworkspace` fails with
        # "Path does not exist".
        #
        # Run pod install explicitly so the workspace always exists. The
        # `ls` at the end is a cheap diagnostic that puts the directory
        # contents in the log — if the workspace still doesn't appear,
        # the listing tells us what DID get created.
        script: |
          npx cap sync ios
          # `pod install` is wrapped in `if [ -f Podfile ]` because Capacitor
          # 8 supports BOTH CocoaPods (legacy) and Swift Package Manager
          # (default for new projects). SPM projects don't have a Podfile;
          # trying to `pod install` errors out and breaks the build.
          if [ -f ios/App/Podfile ]; then
            ( cd ios/App && pod install )
          else
            echo "No Podfile found — Capacitor is using Swift Package Manager. Skipping pod install."
          fi
          # Diagnostic: log directory contents so the next failure (if any)
          # tells us what DID get created.
          ls -la ios/App/

      - name: Inject Info.plist permission strings
        # Apple rejects any app that uses a protected API without a usage description.
        # These six keys cover camera, Face ID, speech recognition, microphone,
        # and read/write access to the system photo library. The two photo-library
        # keys are required even though the app never directly reads from the
        # library — Capacitor's Camera plugin statically references PHPhotoLibrary
        # and Apple's automated review (ITMS-90683) rejects any binary that links
        # those symbols without the matching usage description.
        script: |
          PLIST="ios/App/App/Info.plist"

          add_or_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }

          add_or_set "NSCameraUsageDescription" \
            "Grace Flare uses the camera to capture milestone photos."

          add_or_set "NSFaceIDUsageDescription" \
            "Grace Flare uses Face ID for quick, secure sign-in."

          add_or_set "NSSpeechRecognitionUsageDescription" \
            "Grace Flare uses speech recognition so you can log entries hands-free."

          add_or_set "NSMicrophoneUsageDescription" \
            "Grace Flare uses the microphone to capture your voice for hands-free logging."

          add_or_set "NSPhotoLibraryUsageDescription" \
            "Grace Flare lets you pick existing photos from your library to attach to milestones."

          add_or_set "NSPhotoLibraryAddUsageDescription" \
            "Grace Flare can save milestone photos back to your photo library so they show up in your camera roll."

          # ITSAppUsesNonExemptEncryption=false declares the app uses only
          # exempt encryption (HTTPS / TLS via Apple's URLSession + WKWebView,
          # iOS Keychain). With this key present, App Store Connect skips the
          # "Export Compliance Information" prompt on every TestFlight upload.
          # Flip to <true/> only if a future version bundles its own crypto
          # library (OpenSSL, libsodium, etc.) — then upload the matching
          # compliance documentation under Apple's BIS / EAR rules.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Register deep link URL scheme (graceflare://)
        # Supabase auth redirects (password reset, email confirmation) open via this scheme.
        # Add graceflare://localhost to your Supabase Auth → Redirect URLs list.
        script: |
          PLIST="ios/App/App/Info.plist"

          # Remove any existing entry to avoid duplicates on re-runs
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string $BUNDLE_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string graceflare" "$PLIST"

      - name: Declare WKAppBoundDomains
        # capacitor.config.ts sets limitsNavigationsToAppBoundDomains: true.
        # When that's true, iOS restricts JavaScript document.cookie access,
        # ServiceWorker, and WebStorage to the domains listed here. WebKit
        # caps this list at 10 fully-qualified domains (no wildcards).
        # Without this declaration, AI chat streaming and Supabase auth flows
        # break in the WKWebView.
        script: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :WKAppBoundDomains" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:0 string graceflare.com" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:1 string www.graceflare.com" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:2 string ieuznbvvwdvhtirzwkly.supabase.co" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:3 string api.country.is" "$PLIST"

      - name: Install xcodeproj gem (watch target injection)
        # The Apple Watch companion target can't be committed inside ios/
        # (regenerated every build), so watch/project/inject_watch_target.rb
        # adds it to the freshly-generated project. That script needs the
        # `xcodeproj` Ruby gem. The mac_mini_m2 image ships system Ruby; install
        # the pinned gem version from watch/project/Gemfile.
        script: |
          gem install xcodeproj -v 1.25.0 --no-document

      - name: Set up code signing
        # Manual signing flow — replaces Codemagic's `environment.ios_signing`
        # auto-flow, which failed on first build for the new Bundle ID before
        # any script could run. This version does the full keychain dance:
        #   1. keychain initialize — fresh keychain for this build
        #   2. fetch-signing-files --create — pulls the iOS Distribution cert
        #      and App Store provisioning profile from App Store Connect,
        #      creating them via API if they don't exist. Requires the App
        #      Store Connect integration ("GraceFlare") to be wired up and
        #      the API key to have App Manager role or higher, and the Bundle
        #      ID to already exist in the Apple Developer Portal Identifiers
        #      list (Apple won't auto-create the App ID itself).
        #   3. keychain add-certificates — installs the cert into the
        #      keychain so codesign can find it
        #   4. xcode-project use-profiles — points Xcode at the profile
        # All four commands are idempotent — subsequent builds reuse the
        # same cert + profile.
        #
        # `set -ex` makes every command echo and fail fast — without it,
        # earlier builds had `fetch-signing-files` exit nonzero with
        # `Cannot save Signing Certificates without certificate private key`
        # while the parent script still exited 0, leaving
        # `~/Library/MobileDevice/Provisioning Profiles/` empty and the
        # build step's later `find` reporting a confusing downstream error.
        #
        # `--certificate-key=@env:CERTIFICATE_PRIVATE_KEY` is the actual
        # fix. When `--create` is set, the CLI needs the RSA private key
        # configured in the Codemagic UI as `CERTIFICATE_PRIVATE_KEY` so
        # it can generate a CSR, submit it to Apple Developer Portal, and
        # pair the returned signed cert back with the private key to form
        # the .p12 it installs into the build keychain. The `@env:` prefix
        # is codemagic-cli-tools' convention for "read from this env var".
        #
        # `--platform IOS` is explicit because some versions of the CLI
        # default to MAC_OS when only `--type IOS_APP_STORE` is passed.
        #
        # The final `ls` block prints what landed on disk so the next
        # "Build and export IPA" step has visible evidence to debug
        # against.
        script: |
          set -ex
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          # Second profile for the watch app. The same iOS Distribution cert
          # signs both targets; only the provisioning profile differs. NOTE:
          # `--create` makes the PROFILE, not the App ID — the identifier
          # com.graceflare.app.watchkitapp must already exist in the Apple
          # Developer Portal Identifiers list, exactly like the host bundle id.
          app-store-connect fetch-signing-files "${BUNDLE_ID}.watchkitapp" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

          echo "--- Provisioning Profiles directory ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          echo "--- Certificates directory ---"
          ls -la "$HOME/Library/MobileDevice/Certificates/" 2>/dev/null || true
          echo "--- Keychain identities ---"
          security find-identity -v -p codesigning || true

          # Resolve the newest provisioning profile per target bundle id and
          # export exactly ONE UUID each (+ a single DEVELOPMENT_TEAM) to $CM_ENV
          # for inject_watch_target.rb. xcodebuild applies a single global
          # PROVISIONING_PROFILE_SPECIFIER, which is wrong for two bundle ids, so
          # the specifiers live in the .pbxproj instead. Profiles accumulate on
          # reused CI machines, so we pick the newest by CreationDate per App ID
          # (not the first match) and echo the resolved values to the log so a
          # wrong/empty value is visible.
          python3 - "$BUNDLE_ID" >> "$CM_ENV" <<'PY'
          import os, sys, glob, plistlib, subprocess
          bundle = sys.argv[1]
          dirs = [
              os.path.expanduser("~/Library/Developer/Xcode/UserData/Provisioning Profiles"),
              os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles"),
          ]
          best = {}  # app-id -> (creation_epoch, uuid, team)
          for d in dirs:
              for p in glob.glob(os.path.join(d, "*.mobileprovision")) + glob.glob(os.path.join(d, "*.provisionprofile")):
                  try:
                      pl = plistlib.loads(subprocess.run(["security", "cms", "-D", "-i", p], capture_output=True).stdout)
                  except Exception:
                      continue
                  appid = pl.get("Entitlements", {}).get("application-identifier", "")
                  uuid = pl.get("UUID", "")
                  team = (pl.get("TeamIdentifier") or [""])[0]
                  cd = pl.get("CreationDate")
                  epoch = cd.timestamp() if cd else 0.0
                  cur = best.get(appid)
                  if cur is None or epoch > cur[0]:
                      best[appid] = (epoch, uuid, team)
          def pick(suffix):
              target = "." + bundle + suffix
              for appid, (epoch, uuid, team) in best.items():
                  if appid.endswith(target):
                      return uuid, team
              return "", ""
          ios_uuid, ios_team = pick("")
          watch_uuid, watch_team = pick(".watchkitapp")
          team = ios_team or watch_team
          out = []
          if team: out.append("DEVELOPMENT_TEAM=" + team)
          if ios_uuid: out.append("IOS_PROFILE_UUID=" + ios_uuid)
          if watch_uuid: out.append("WATCH_PROFILE_UUID=" + watch_uuid)
          print("\n".join(out))
          sys.stderr.write("Resolved signing -> " + (" ".join(out) if out else "NONE FOUND") + "\n")
          PY

      - name: Inject watchOS target + iOS glue
        # Adds the single SwiftUI watch app target (com.graceflare.app.watchkitapp),
        # the Embed Watch Content phase, per-target signing (using the UUIDs the
        # signing step exported to $CM_ENV), and copies the WatchConnectivity
        # glue from ios-watch-glue/ into the App target. See watch/README.md.
        # Runs AFTER signing (needs the profile UUIDs) and BEFORE the version
        # bump (so agvtool -all also bumps the new watch target).
        script: |
          set -ex
          ruby watch/project/inject_watch_target.rb

      - name: Bump CFBundleVersion (all targets)
        # App Store Connect rejects an upload whose CFBundleVersion matches any
        # previous build. Unix timestamp = guaranteed monotonic uniqueness.
        # `-all` bumps every target in the project — including the watch target,
        # whose CFBundleVersion must match the host app. Runs after injection so
        # the watch target exists. CFBundleShortVersionString (marketing 1.0 …)
        # is left to project settings; update manually when shipping.
        script: |
          cd ios/App
          xcrun agvtool new-version -all "$(date +%s)"

      - name: Build and export IPA
        # Capacitor 8 supports both CocoaPods (workspace) and Swift Package
        # Manager (xcodeproj-only). Detect which layout is present and pass
        # the right --workspace / --project flag to xcode-project build-ipa.
        #
        # Signing override (the meat of this step):
        # The earlier "Set up code signing" step fetches the App Store
        # provisioning profile + iOS Distribution cert via
        # `app-store-connect fetch-signing-files --create` and installs them
        # into the build keychain. Then `xcode-project use-profiles` is
        # supposed to update the .pbxproj's CODE_SIGN_STYLE,
        # DEVELOPMENT_TEAM, and PROVISIONING_PROFILE_SPECIFIER to use the
        # fetched profile. With Capacitor 8 + SPM projects, use-profiles
        # only partially applies (switches to Manual but leaves team blank),
        # producing the build error:
        #   "App" requires a provisioning profile. Select a provisioning
        #   profile in the Signing & Capabilities editor.
        #
        # Fix: extract the team ID and profile name directly from the
        # installed .mobileprovision file and pass them to xcodebuild via
        # --archive-xcargs. This bypasses use-profiles entirely and makes
        # the signing config explicit at build time.
        script: |
          # Find the installed provisioning profile and decode its plist.
          # Xcode 16 / codemagic-cli-tools install profiles into the new
          # `~/Library/Developer/Xcode/UserData/Provisioning Profiles/`
          # directory; older Xcode versions used
          # `~/Library/MobileDevice/Provisioning Profiles/`. Search both
          # so this step works regardless of which path the toolchain
          # populates.
          NEW_PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          LEGACY_PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_FILE=$(find \
            "$NEW_PROFILE_DIR" "$LEGACY_PROFILE_DIR" \
            -maxdepth 1 \
            \( -name "*.mobileprovision" -o -name "*.provisionprofile" \) \
            2>/dev/null | head -1)
          if [ -z "$PROFILE_FILE" ]; then
            echo "ERROR: no provisioning profile found in either"
            echo "  $NEW_PROFILE_DIR"
            echo "  $LEGACY_PROFILE_DIR"
            ls -la "$NEW_PROFILE_DIR" 2>/dev/null || echo "  ($NEW_PROFILE_DIR missing)"
            ls -la "$LEGACY_PROFILE_DIR" 2>/dev/null || echo "  ($LEGACY_PROFILE_DIR missing)"
            echo "--- Searching whole \$HOME for any profile file ---"
            find "$HOME" -name "*.mobileprovision" -o -name "*.provisionprofile" 2>/dev/null || true
            echo "--- Keychain identities (codesigning) ---"
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "Profile file: $PROFILE_FILE"

          TEAM_ID=$(security cms -D -i "$PROFILE_FILE" | \
            python3 -c "import sys, plistlib; d = plistlib.loads(sys.stdin.buffer.read()); print(d['TeamIdentifier'][0])")
          PROFILE_NAME=$(security cms -D -i "$PROFILE_FILE" | \
            python3 -c "import sys, plistlib; d = plistlib.loads(sys.stdin.buffer.read()); print(d['Name'])")
          PROFILE_UUID=$(security cms -D -i "$PROFILE_FILE" | \
            python3 -c "import sys, plistlib; d = plistlib.loads(sys.stdin.buffer.read()); print(d['UUID'])")
          echo "Team ID:       $TEAM_ID"
          echo "Profile name:  $PROFILE_NAME"
          echo "Profile UUID:  $PROFILE_UUID"

          # TWO targets (App + GraceFlareWatch) now need DIFFERENT provisioning
          # profiles, so we CANNOT pass a single global
          # PROVISIONING_PROFILE_SPECIFIER on the command line — that would force
          # one profile onto both bundle ids and fail. The per-target
          # PROVISIONING_PROFILE_SPECIFIER values were written into the .pbxproj
          # by inject_watch_target.rb (from the UUIDs the signing step exported).
          # Here we only pass the shared DEVELOPMENT_TEAM + Manual style; each
          # target's specifier comes from the project.
          XCARGS="DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Manual"
          echo "Archive xcargs: $XCARGS"

          # NOTE on the `=` syntax for --archive-flags: the value
          # `-allowProvisioningUpdates` starts with `-`, which Python's
          # argparse refuses to consume as a positional value (thinks it's
          # another flag). Using `--archive-flags=...` joins them into a
          # single token so argparse parses it correctly.
          if [ -d "$XCODE_WORKSPACE" ]; then
            echo "Building from workspace: $XCODE_WORKSPACE"
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME" \
              --archive-flags=-allowProvisioningUpdates \
              --archive-xcargs "$XCARGS"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            echo "No workspace found; building from xcodeproj (SPM layout)"
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "$XCODE_SCHEME" \
              --archive-flags=-allowProvisioningUpdates \
              --archive-xcargs "$XCARGS"
          else
            echo "ERROR: neither $XCODE_WORKSPACE nor ios/App/App.xcodeproj exists"
            ls -la ios/ ios/App/ 2>/dev/null
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploads the IPA to App Store Connect on every successful build.
        # Internal TestFlight testers (added in App Store Connect → Users
        # and Access → TestFlight Internal Testers) can install the build
        # as soon as Apple finishes processing it (~5-10 min after upload).
        #
        # `submit_to_testflight: false` is deliberate for v1. Setting it
        # to `true` would submit the build for **external** TestFlight
        # review, which requires Beta App Information (Feedback Email)
        # and Beta App Review Information (First/Last Name, Phone, Email)
        # to be filled in at
        #   https://appstoreconnect.apple.com/apps/6763634933/testflight/test-info
        # When you're ready to invite people outside the dev team, fill
        # those fields in and flip this flag back to true.
        #
        # Promote to App Store manually from App Store Connect once ready.
        # `cancel_previous_submissions` is intentionally omitted: it only
        # applies to App Store review submissions (`submit_to_app_store`),
        # which we don't do here. Codemagic's validator rejects the flag
        # when paired with TestFlight-only publishing.
        submit_to_testflight: false
      # The `email` publishing block was removed: Codemagic's validator
      # evaluates `$CM_SUBMITTER` to None at validation time and rejects
      # null as a recipient. Build outcomes are still visible in the
      # Codemagic dashboard and via the GitHub commit-status check on
      # the merge commit. Re-add with a literal address when needed:
      #   email:
      #     recipients:
      #       - team@graceflare.com
      #     notify: { success: true, failure: true }
