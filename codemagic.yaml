workflows:
  ios-release:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      # References the App Store Connect integration named "Graceflare"
      # configured in Codemagic → Teams → Integrations → App Store Connect.
      # Drives both ios_signing (cert / profile fetch) and the publishing
      # step's `auth: integration` (TestFlight upload).
      app_store_connect: Graceflare

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.graceflare.app
      vars:
        BUNDLE_ID: com.graceflare.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # --- Codemagic UI → Environment variables (Secure unless noted) ---
        # VITE_APP_URL              https://graceflare.com  (Plain text)
        # CERTIFICATE_PRIVATE_KEY   RSA priv key Codemagic uses to encrypt
        #                           fetched signing certs. Generate with:
        #                             ssh-keygen -t rsa -b 2048 -m PEM \
        #                               -f codemagic_signing -q -N ""
        # --- Codemagic UI → Team integrations → App Store Connect ---
        # The Issuer ID + Key ID + .p8 file are configured there, not as
        # env vars. The `auth: integration` line under publishing
        # references that integration. Same key drives `ios_signing` above.
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build
        # VITE_APP_URL comes from Codemagic env vars once you have a domain.
        # Until then it falls back to window.location.origin = graceflare://localhost.

      - name: Add iOS platform
        script: |
          # Always start clean — ios/ is not committed to git
          rm -rf ios/
          npx cap add ios

      - name: Copy app icons into iOS project
        # The 1024 master + 15 pre-rendered iOS sizes + Contents.json live at
        # assets/ios/AppIcon.appiconset/. We blow away the default Capacitor
        # AppIcon.appiconset (which has a blank icon) and drop ours in. This
        # also catches stale files Capacitor's template might have shipped that
        # we don't want in the final binary.
        # Android assets live at assets/android/mipmap-*/ for when we add an
        # Android workflow — not wired up here yet.
        script: |
          DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$DEST"
          cp -R assets/ios/AppIcon.appiconset "$DEST"

      - name: Sync Capacitor
        # Copies dist/ into the native project and installs pod dependencies
        script: npx cap sync ios

      - name: Inject Info.plist permission strings
        # Apple rejects any app that uses a protected API without a usage description.
        # These four keys cover camera, Face ID, speech recognition, and microphone.
        script: |
          PLIST="ios/App/App/Info.plist"

          add_or_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }

          add_or_set "NSCameraUsageDescription" \
            "Grace Flare uses the camera to capture milestone photos."

          add_or_set "NSFaceIDUsageDescription" \
            "Grace Flare uses Face ID for quick, secure sign-in."

          add_or_set "NSSpeechRecognitionUsageDescription" \
            "Grace Flare uses speech recognition so you can log entries hands-free."

          add_or_set "NSMicrophoneUsageDescription" \
            "Grace Flare uses the microphone to capture your voice for hands-free logging."

      - name: Register deep link URL scheme (graceflare://)
        # Supabase auth redirects (password reset, email confirmation) open via this scheme.
        # Add graceflare://localhost to your Supabase Auth → Redirect URLs list.
        script: |
          PLIST="ios/App/App/Info.plist"

          # Remove any existing entry to avoid duplicates on re-runs
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string $BUNDLE_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string graceflare" "$PLIST"

      - name: Declare WKAppBoundDomains
        # capacitor.config.ts sets limitsNavigationsToAppBoundDomains: true.
        # When that's true, iOS restricts JavaScript document.cookie access,
        # ServiceWorker, and WebStorage to the domains listed here. WebKit
        # caps this list at 10 fully-qualified domains (no wildcards).
        # Without this declaration, AI chat streaming and Supabase auth flows
        # break in the WKWebView.
        script: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :WKAppBoundDomains" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:0 string graceflare.com" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:1 string www.graceflare.com" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:2 string ieuznbvvwdvhtirzwkly.supabase.co" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:3 string api.country.is" "$PLIST"

      - name: Bump CFBundleVersion
        # App Store Connect rejects an upload whose CFBundleVersion matches
        # any previous build. Use a Unix timestamp for guaranteed monotonic
        # uniqueness without a separate counter file. CFBundleShortVersionString
        # (the user-facing 1.0 / 1.1 / etc.) is left to Xcode project settings;
        # update it manually in ios/App/App.xcodeproj when shipping a new
        # marketing version.
        script: |
          cd ios/App
          xcrun agvtool new-version -all "$(date +%s)"

      - name: Set up code signing
        # Codemagic's automatic signing (configured via `environment.ios_signing`)
        # sometimes fails with "No matching profiles found" on first build for a
        # new Bundle ID — the auto-create step doesn't always trigger reliably.
        # Calling `fetch-signing-files --create` explicitly forces Codemagic to
        # create the iOS Distribution cert and App Store provisioning profile
        # via the App Store Connect API if they don't already exist. Subsequent
        # builds reuse the same cert + profile. Idempotent.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight automatically on every successful build.
        # Promote to App Store manually from App Store Connect once ready.
        # `cancel_previous_submissions` is intentionally omitted: it only
        # applies to App Store review submissions (`submit_to_app_store`),
        # which we don't do here. Codemagic's validator rejects the flag
        # when paired with TestFlight-only publishing.
        submit_to_testflight: true
      # The `email` publishing block was removed: Codemagic's validator
      # evaluates `$CM_SUBMITTER` to None at validation time and rejects
      # null as a recipient. Build outcomes are still visible in the
      # Codemagic dashboard and via the GitHub commit-status check on
      # the merge commit. Re-add with a literal address when needed:
      #   email:
      #     recipients:
      #       - team@graceflare.com
      #     notify: { success: true, failure: true }
