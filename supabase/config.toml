# JWT verification per edge function. CI deploys every function in
# supabase/functions/ and reads these settings, so a deploy never changes a
# function's auth mode. Values match production as of 2026-09-30. A function
# with verify_jwt = false authenticates callers itself (user JWT via
# auth.getUser, or a service-role check for cron/internal callers).
# A new function defaults to verify_jwt = true unless listed here.

[functions.briefing]
verify_jwt = false

[functions.chat]
verify_jwt = false

# pg_cron only. Since 2026-10-03 the cron job sends the `cron` secret key
# (sb_secret_...) on the apikey header, which the platform JWT gate cannot
# validate; the function checks it itself (_shared/requireCronKey.ts).
# Manual deploy: supabase functions deploy check-notifications --no-verify-jwt
[functions.check-notifications]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.extract-memory]
verify_jwt = false

[functions.generate-activity-plan]
verify_jwt = true

[functions.generate-speech-class]
verify_jwt = true

# pg_cron only; authorizes the `cron` secret key itself (requireCronKey.ts).
[functions.inactive-account-purge]
verify_jwt = false

[functions.mcp]
verify_jwt = false

# pg_cron only; authorizes the `cron` secret key itself (requireCronKey.ts).
[functions.reactivate-nudge]
verify_jwt = false

# Not yet deployed as of 2026-09-30. Called by check-notifications with the
# service-role key and checks the role claim itself (index.ts ~L177-200).
[functions.send-visit-reminder-email]
verify_jwt = false

[functions.send-vpc-email]
verify_jwt = false

# Not yet deployed as of 2026-09-30. Called from the app via
# supabase.functions.invoke with the parent's JWT; same mode as the other
# user-invoked Flare+ generators.
[functions.visit-prep-questions]
verify_jwt = true

[functions.weekly-insights]
verify_jwt = false
